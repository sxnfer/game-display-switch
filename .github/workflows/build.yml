# Builds the app and runs the checks in tests\ on every push and pull request, so a change that doesn't compile
# or breaks one of them is caught before a release.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build
        shell: cmd
        run: call build.cmd
      - name: Test
        shell: cmd
        run: call test.cmd
