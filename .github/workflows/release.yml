# Push a tag like v1.2.0 → GitHub builds HdrSwitch.exe from this exact commit, runs the checks, and publishes a release
# with the exe, its SHA256 checksum and a signature of that checksum. The app's updater only installs an exe whose
# checksum matches, from a checksum file whose signature matches the update key built into the app.
#
# Secrets (Settings › Secrets and variables › Actions):
#   UPDATE_SIGNING_KEY     required: the private update key, RSA in .NET XML form. Without it the release stops here,
#                          because no copy of the app would install it. See docs/how-it-works.md.
#   SIGNING_CERT_PFX       optional: a code-signing certificate (.pfx, base64). With it the exe is Authenticode-signed,
#   SIGNING_CERT_PASSWORD  so Windows shows the publisher instead of "Unknown publisher".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.SIGNING_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          set TAG=${{ github.ref_name }}
          call build.cmd %TAG:~1%

      - name: Test
        shell: cmd
        run: call test.cmd

      - name: Code-sign the exe
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.SIGNING_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Display Switch" HdrSwitch.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          } finally { Remove-Item $pfx -Force }

      - name: Checksum
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version goes into the signed file too: the tag isn't signed, and the app only installs a release whose
          # signed version is its tag. sha256sum -c passes over the # line; the exe's line stays as older copies read it.
          $version = $env:TAG.Substring(1)   # as build.cmd gets it: the tag without its v
          $hash = (Get-FileHash HdrSwitch.exe -Algorithm SHA256).Hash.ToLower()
          "# version $version", "$hash  HdrSwitch.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Sign the checksum
        shell: pwsh
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_KEY) { throw "The UPDATE_SIGNING_KEY secret is missing: the app only installs signed releases. See docs/how-it-works.md." }
          $rsa = [Security.Cryptography.RSA]::Create()
          $rsa.FromXmlString($env:UPDATE_KEY)
          $bytes = [IO.File]::ReadAllBytes("SHA256SUMS.txt")
          $sig = $rsa.SignData($bytes, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
          [IO.File]::WriteAllText("SHA256SUMS.txt.sig", [Convert]::ToBase64String($sig))
          if (-not $rsa.VerifyData($bytes, $sig, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)) { throw "signature check failed" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" HdrSwitch.exe SHA256SUMS.txt SHA256SUMS.txt.sig --title "Display Switch ${{ github.ref_name }}" --generate-notes
